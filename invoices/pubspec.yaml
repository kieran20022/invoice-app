name: invoices
description: "Professional invoice generation app with Firebase backend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.0

  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.0

  # Image handling
  image_picker: ^1.1.0

  # State management
  provider: ^6.1.0

  # Environment variables
  flutter_dotenv: ^5.2.0

  # Utilities
  path_provider: ^2.1.0
  http: ^1.2.0
  uuid: ^4.5.0
  intl: ^0.20.0
  share_plus: ^10.1.0
  flutter_email_sender: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
