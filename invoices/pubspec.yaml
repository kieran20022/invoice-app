name: invoices
description: "Professional invoice generation app with Firebase backend"
publish_to: 'none'
# The app's version is MAJOR.MINOR (4.3), counted in tenths: 4.9 is followed
# by 5.0. The patch part stays 0 and the build number is MAJOR*10+MINOR, so it
# always grows. Bump it with `dart run tool/bump_version.dart`, which keeps
# both in step. The release APK is named after it: Invoices_4.3.apk.
version: 4.3.0+43

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.0

  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.0

  # Image handling
  image_picker: ^1.1.0

  # State management
  provider: ^6.1.0

  # Environment variables
  flutter_dotenv: ^5.2.0

  # Utilities
  path_provider: ^2.1.0
  http: ^1.2.0
  uuid: ^4.5.0
  intl: ^0.20.0
  share_plus: ^10.1.0

  # Excel (xlsx) export — the workbook XML is written by hand, this only zips it
  archive: ^4.0.0

  # Browser download of an export (web build only)
  web: ^1.1.0
  fl_chart: ^0.70.0
  flutter_email_sender: ^6.0.3
  syncfusion_flutter_pdf: 33.2.13
  file_selector: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
